[project]
name = "the-flow-fabric-backend"
version = "0.1.0"
description = "Flow Scout — agent de gouvernance cognitive, traçabilité et préparation Flow Atlas."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "boto3>=1.35",
    "beautifulsoup4>=4.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pyjwt[crypto]>=2.10",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "live: hit real Anthropic / Voyage APIs (skipped by default; requires keys)",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.uv]
package = false
